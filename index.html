<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Manual interactivo · Ruta SISE Administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#FF0E49;--dark:#241F21;--ink:#1f2937;--muted:#687386;--line:#e3e7ec;--soft:#fff1f5;--paper:#f8fafc;--green:#0f8a63;--amber:#b7791f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f4f5;font-family:Inter,Arial,sans-serif;color:var(--ink)}button{font:inherit}.shell{max-width:1180px;margin:auto;background:#fff;min-height:100vh}.hero{padding:34px;background:linear-gradient(135deg,#241F21,#42252f 72%,#651735);color:#fff;position:relative;overflow:hidden}.hero:after{content:'ADMIN';position:absolute;right:22px;top:5px;font:800 86px 'Barlow Condensed';color:rgba(255,255,255,.035)}.brand{font:800 28px 'Barlow Condensed'}.brand b{color:var(--red)}.badge{display:inline-flex;background:var(--red);padding:7px 11px;border-radius:999px;font:700 13px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.06em;margin-top:20px}.hero h1{font:800 clamp(40px,7vw,68px)/.95 'Barlow Condensed';text-transform:uppercase;margin:12px 0}.hero p{max-width:760px;color:#f2dfe5;font-size:15px;line-height:1.55}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}.tabs button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:white;padding:10px 13px;border-radius:12px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--red);border-color:var(--red)}main{padding:28px 34px 60px}.panel{display:none}.panel.active{display:block}.head{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}.num{width:46px;height:46px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font:800 22px 'Barlow Condensed';flex:0 0 auto}.head h2{font:800 31px 'Barlow Condensed';margin:0}.head p{margin:3px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.card h3{font:800 22px 'Barlow Condensed';margin:0 0 8px}.card p,.card li{font-size:14px;line-height:1.5;color:#546172}.card ul{padding-left:18px}.dark{background:var(--dark);color:#fff}.dark p,.dark li{color:#ded5d8}.filter-demo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fake-filter{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fafafa}.fake-filter b{display:block;font-size:11px;color:#667085;margin-bottom:5px}.fake-filter span{font-size:13px}.table-demo{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:14px}.table-demo table{border-collapse:collapse;width:100%;min-width:860px}.table-demo th{background:#f8fafc;text-align:left;font-size:11px;color:#667085;padding:10px}.table-demo td{padding:12px 10px;border-top:1px solid #edf0f3;font-size:12px}.tag{display:inline-flex;border-radius:999px;padding:5px 8px;font-weight:800;font-size:10px;background:#fff4dd;color:#8a6400}.tag.green{background:#eaf8f2;color:#0f6a4d}.accordion{display:grid;gap:10px}.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden}.acc button{width:100%;border:0;background:#fff;padding:15px 16px;font-weight:700;text-align:left;display:flex;justify-content:space-between;cursor:pointer}.acc-body{display:none;padding:0 16px 16px;color:#566273;font-size:14px;line-height:1.55}.acc.open .acc-body{display:block}.acc.open button{background:#fff8fa}.callout{border-left:5px solid var(--red);background:#fff8fa;border-radius:13px;padding:15px 16px;margin-top:14px;font-size:14px;line-height:1.55}.flow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.pill{padding:8px 11px;border-radius:999px;background:var(--soft);border:1px solid #ffd0dd;color:#9b1038;font-weight:700;font-size:13px}.arrow{color:var(--red);font-weight:900}.checklist{display:grid;gap:9px}.check{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}.check input{accent-color:var(--red);margin-top:3px}.check.checked{background:#effaf5;border-color:#cbe8dc}.footerbar{margin-top:24px;background:var(--dark);color:white;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.footerbar span{font-size:13px;color:#ded5d8}.footerbar strong{font:800 22px 'Barlow Condensed'}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.nav button{border:1px solid var(--line);border-radius:12px;background:white;padding:11px 15px;font-weight:700;cursor:pointer}.nav .next{background:var(--red);border-color:var(--red);color:white}@media(max-width:800px){.hero,main{padding-left:18px;padding-right:18px}.grid,.filter-demo{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell"><header class="hero"><div class="brand">SISE<b>»</b> <span style="font-size:14px;opacity:.8">Instituto Superior</span></div><div class="badge">Manual interactivo</div><h1>Ruta SISE · Administrador</h1><p>Guía para consultar registros e ítems, aplicar filtros, revisar evidencias, interpretar tiempos, descargar información y distinguir los registros de campo de los eventos de visita.</p><nav class="tabs" id="tabs"></nav></header><main><div id="panels"></div><div class="footerbar"><span>Avance del manual</span><strong id="prog">1 / 6</strong></div><div class="nav"><button id="prev">← Anterior</button><button class="next" id="next">Siguiente →</button></div></main></div>
<script>
const DATA=[
{short:'Acceso',title:'Acceso y propósito',html:`<div class="head"><div class="num">01</div><div><h2>Acceso y propósito del Administrador</h2><p>El perfil Administrador es una herramienta de consulta, control y descarga. No reemplaza el registro de campo.</p></div></div><div class="grid"><div class="card"><h3>Qué puedes hacer</h3><ul><li>Consultar registros institucionales.</li><li>Filtrar hallazgos por variables clave.</li><li>Revisar cada ítem de un registro.</li><li>Ver y descargar evidencias.</li><li>Descargar registros y consolidado.</li><li>Consultar eventos de inicio/cierre de visita.</li></ul></div><div class="card dark"><h3>Principio de lectura</h3><p><b>ID_VISITA</b> vincula todos los eventos y registros de una misma visita. <b>ID_REGISTRO</b> identifica un hallazgo. La columna <b>ITEM</b> diferencia los temas registrados dentro del mismo hallazgo.</p></div></div>`},
{short:'Registros',title:'Vista de registros',html:`<div class="head"><div class="num">02</div><div><h2>Cómo leer la vista de Registros</h2><p>Cada fila representa un ítem analizable. Un mismo ID_REGISTRO puede aparecer en varias filas.</p></div></div><div class="flow"><span class="pill">ID_VISITA</span><span class="arrow">→</span><span class="pill">ID_REGISTRO</span><span class="arrow">→</span><span class="pill">ITEM</span><span class="arrow">→</span><span class="pill">DIMENSIÓN</span><span class="arrow">→</span><span class="pill">¿QUÉ OBSERVÓ?</span></div><div class="table-demo"><table><thead><tr><th>ID visita</th><th>ID registro</th><th>Ítem</th><th>Tipo</th><th>Dimensión</th><th>¿Qué observó?</th><th>Detalle</th></tr></thead><tbody><tr><td>VIS-001</td><td>RA-001</td><td><span class="tag">Ítem 1</span></td><td>Voz docente</td><td>D13</td><td>Uso de plataformas</td><td>Requiere apoyo para rúbricas.</td></tr><tr><td>VIS-001</td><td>RA-001</td><td><span class="tag">Ítem 2</span></td><td>Voz docente</td><td>D3</td><td>Acceso a Canvas / LMS</td><td>Reporta demora de acceso.</td></tr></tbody></table></div><div class="callout">No interpretes dos filas con el mismo ID_REGISTRO como dos entrevistas distintas. Son dos ítems del mismo registro cuando la columna ITEM cambia.</div>`},
{short:'Filtros',title:'Filtros',html:`<div class="head"><div class="num">03</div><div><h2>Uso correcto de filtros</h2><p>Los desplegables muestran los catálogos institucionales aunque todavía no existan registros en todas las opciones.</p></div></div><div class="filter-demo"><div class="fake-filter"><b>SEDE</b><span>Todas las sedes</span></div><div class="fake-filter"><b>TIPO DE REGISTRO</b><span>Observar clase / sede / voces / otros</span></div><div class="fake-filter"><b>DIMENSIÓN</b><span>D1 a D13</span></div><div class="fake-filter"><b>¿QUÉ OBSERVASTE?</b><span>Depende de la dimensión elegida</span></div><div class="fake-filter"><b>ÁREA VISITANTE</b><span>Catálogo institucional</span></div><div class="fake-filter"><b>ROL</b><span>Catálogo institucional</span></div><div class="fake-filter"><b>MODALIDAD</b><span>Presencial / Virtual</span></div><div class="fake-filter"><b>NATURALEZA</b><span>Alerta / Brecha / Oportunidad / Fortaleza</span></div><div class="fake-filter"><b>TIPO PERSONA</b><span>Estudiante / Egresado / Docente</span></div></div><div class="callout"><b>No se usan como filtros Turno ni Programa/carrera</b> en la versión administrativa actual. En la vista de Eventos de visita solo se aplican los filtros compatibles con datos de visita.</div>`},
{short:'Visitas',title:'Eventos de visita',html:`<div class="head"><div class="num">04</div><div><h2>Inicio / cierre de visitas</h2><p>Esta vista está separada de Registros de campo y responde a los filtros compatibles.</p></div></div><div class="grid"><div class="card"><h3>Eventos que verás</h3><ul><li>Inicio de visita.</li><li>Cierre de visita.</li><li>ID de visita.</li><li>Fecha y hora.</li><li>Visitante, área y rol.</li><li>Sede y modalidad.</li><li>Duración cuando corresponde.</li></ul></div><div class="card"><h3>Filtros aplicables</h3><ul><li>Buscar.</li><li>Sede.</li><li>Área visitante.</li><li>Rol.</li><li>Modalidad.</li><li>Fecha.</li></ul></div></div><div class="callout">La tabla de Eventos de visita no debe mostrar los ítems del registro. Su función es auditar el inicio y cierre de la jornada de visita.</div>`},
{short:'Evidencias',title:'Evidencias y detalle',html:`<div class="head"><div class="num">05</div><div><h2>Detalle, evidencias y descargas</h2><p>Usa el detalle para revisar el contexto completo y las evidencias para validar el hallazgo.</p></div></div><div class="accordion"><div class="acc"><button>Ver detalle<span>+</span></button><div class="acc-body">Muestra identificación, tipo, dimensión, “¿Qué observaste?”, detalle, clasificación, persona/contexto y tiempos del registro.</div></div><div class="acc"><button>Evidencias<span>+</span></button><div class="acc-body">Las evidencias privadas se abren mediante enlaces temporales. Si no están sincronizadas, el registro puede indicar que existe evidencia pero no encontrar aún el archivo en nube.</div></div><div class="acc"><button>Descargar Excel<span>+</span></button><div class="acc-body">La descarga debe conservar una fila por ítem para que dimensión, “¿Qué observaste?” y detalle puedan filtrarse correctamente.</div></div><div class="acc"><button>Consolidado general<span>+</span></button><div class="acc-body">Permite revisar la base central. Los eventos de visita se mantienen separados de los registros de campo.</div></div></div>`},
{short:'Checklist',title:'Checklist de administración',html:`<div class="head"><div class="num">06</div><div><h2>Checklist de consulta responsable</h2><p>Antes de cerrar una revisión administrativa, valida estos puntos.</p></div></div><div class="checklist">${['Estoy en la vista correcta: Registros o Eventos de visita.','Apliqué solo los filtros necesarios y sé cuáles afectan la vista de visitas.','Interpreté ID_VISITA, ID_REGISTRO e ITEM correctamente.','Revisé dimensión, ¿Qué observaste? y detalle antes de concluir.','Validé las evidencias disponibles cuando el hallazgo lo requiere.','Al descargar, mantuve una fila por ítem para análisis.','No modifiqué datos desde el Administrador: es una vista de consulta y supervisión.'].map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}"><span>${x}</span></label>`).join('')}</div>`}
];
let cur=0;const tabs=document.getElementById('tabs'),panels=document.getElementById('panels');tabs.innerHTML=DATA.map((x,i)=>`<button data-tab="${i}">${x.short}</button>`).join('');panels.innerHTML=DATA.map((x,i)=>`<section class="panel" data-panel="${i}">${x.html}</section>`).join('');
function bind(){document.querySelectorAll('.acc button').forEach(b=>{if(b.dataset.b)return;b.dataset.b=1;b.onclick=()=>{const a=b.closest('.acc');a.classList.toggle('open');b.lastElementChild.textContent=a.classList.contains('open')?'−':'+'}});document.querySelectorAll('[data-check]').forEach(c=>{if(c.dataset.b)return;c.dataset.b=1;c.onchange=()=>c.closest('.check').classList.toggle('checked',c.checked)})}
function show(i){cur=Math.max(0,Math.min(DATA.length-1,i));document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===cur));document.querySelectorAll('[data-tab]').forEach((b,j)=>b.classList.toggle('active',j===cur));document.getElementById('prog').textContent=`${cur+1} / ${DATA.length}`;document.getElementById('prev').disabled=cur===0;document.getElementById('next').textContent=cur===DATA.length-1?'Volver al inicio ↺':'Siguiente →';window.scrollTo({top:document.querySelector('main').offsetTop-10,behavior:'smooth'});bind()}
tabs.onclick=e=>{const b=e.target.closest('[data-tab]');if(b)show(+b.dataset.tab)};document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur===DATA.length-1?0:cur+1);show(0);
</script></body></html>
